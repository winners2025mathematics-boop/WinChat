name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create Flutter scaffolding
        run: |
          flutter create --org com.winchat --project-name smsgateway --platforms=android temp_scaffold
          cp -rn temp_scaffold/android/. android/ 2>/dev/null || true
          # Remove the Groovy build.gradle if it got copied — we use Kotlin DSL
          rm -f android/app/build.gradle
          rm -f android/build.gradle
          cp -rn temp_scaffold/test/ . 2>/dev/null || true
          rm -rf temp_scaffold

      - name: Verify
        run: |
          ls -la android/app/
          grep -n "google-services" android/app/build.gradle.kts

      - run: flutter pub get
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: sms-gateway-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
