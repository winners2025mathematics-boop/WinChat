name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Generate fresh Flutter project
        run: |
          flutter create --org com.winchat --project-name smsgateway --platforms=android fresh
          ls -la fresh/android/app/

      - name: Overlay our custom files
        run: |
          cp lib/main.dart fresh/lib/main.dart
          cp pubspec.yaml fresh/pubspec.yaml
          cp android/app/src/main/AndroidManifest.xml fresh/android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: |
          cd fresh
          flutter pub get

      - name: Build debug APK
        run: |
          cd fresh
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sms-gateway-apk
          path: fresh/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
