name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Generate fresh Flutter project
        run: |
          flutter create --org com.winchat --project-name smsgateway --platforms=android fresh
          ls -la fresh/android/app/

      - name: Overlay our custom files
        run: |
          cp lib/main.dart fresh/lib/main.dart
          cp android/app/google-services.json fresh/android/app/google-services.json
          cp pubspec.yaml fresh/pubspec.yaml
          cp android/app/src/main/AndroidManifest.xml fresh/android/app/src/main/AndroidManifest.xml

      - name: Apply Google Services plugin
        run: |
          cd fresh
          ls -la android/

          # Determine which gradle file type was generated
          if [ -f android/app/build.gradle.kts ]; then
            APP_GRADLE="android/app/build.gradle.kts"
            PROJECT_GRADLE="android/settings.gradle.kts"
            GROOVY=false
          else
            APP_GRADLE="android/app/build.gradle"
            PROJECT_GRADLE="android/settings.gradle"
            GROOVY=true
          fi

          echo "Using: $APP_GRADLE and $PROJECT_GRADLE"

          # Apply google-services plugin to app-level
          if [ "$GROOVY" = "true" ]; then
            if ! grep -q "com.google.gms.google-services" "$APP_GRADLE"; then
              echo "apply plugin: 'com.google.gms.google-services'" >> "$APP_GRADLE"
            fi
          else
            if ! grep -q "com.google.gms.google-services" "$APP_GRADLE"; then
              echo 'apply(plugin = "com.google.gms.google-services")' >> "$APP_GRADLE"
            fi
          fi

          # Apply plugin declaration to project-level
          if [ "$GROOVY" = "true" ]; then
            if ! grep -q "com.google.gms.google-services" "$PROJECT_GRADLE"; then
              sed -i "/id \"dev.flutter.flutter-plugin-loader\"/a\\    id \"com.google.gms.google-services\" version \"4.4.2\" apply false" "$PROJECT_GRADLE"
            fi
          else
            if ! grep -q "com.google.gms.google-services" "$PROJECT_GRADLE"; then
              sed -i '/id("dev.flutter.flutter-plugin-loader")/a\    id("com.google.gms.google-services") version "4.4.2" apply false' "$PROJECT_GRADLE"
            fi
          fi

      - name: Verify before build
        run: |
          cd fresh
          echo "=== android/app/ ==="
          ls -la android/app/
          echo "=== google-services.json ==="
          head -5 android/app/google-services.json
          echo "=== app gradle (google-services line) ==="
          grep -n "google-services" android/app/build.gradle* || echo "NOT FOUND"
          echo "=== project gradle (google-services line) ==="
          grep -n "google-services" android/settings.gradle* || echo "NOT FOUND"

      - name: Install dependencies
        run: |
          cd fresh
          flutter pub get

      - name: Build debug APK
        run: |
          cd fresh
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sms-gateway-apk
          path: fresh/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
